services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flyrank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d flyrank"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/flyrank
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: python -m app.workers.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/flyrank
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
