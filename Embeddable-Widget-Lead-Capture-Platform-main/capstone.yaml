name: flyrank-capstone-widget-platform
run: docker compose up --build
seed: docker compose exec api python scripts/seed.py
test: pytest -q
base_url: http://localhost:8000
customer_origin: http://localhost:5500
endpoints:
  - GET /health
  - POST /api/v1/auth/register
  - POST /api/v1/auth/login
  - GET /api/v1/widgets
  - POST /api/v1/widgets
  - GET /api/v1/public/widgets/{widget_id}/config
  - GET /widget.v1.js?id={widget_id}
  - POST /api/v1/public/submissions
  - OPTIONS /api/v1/public/submissions
  - GET /api/v1/dashboard/submissions
  - GET /api/v1/dashboard/stats
